# 패키지 모드로 빌드한 이 포크의 RTL·패키지를 가리키는 설정.
#
# 쓰는 법:
#   $env:PPC_CONFIG_PATH = "C:\works\fpc-unleashed\cfg"
#   C:\works\fpc-unleashed\compiler\fcc64.exe ... myprogram.pas
#
# ⚠️ 설치된 배포본(C:\fpcunleashed)의 유닛은 절대 섞지 않는다.
#    그쪽은 tf_supports_packages 없이 빌드되어 `..$indirect` 심볼이 없다.

-FuC:\works\fpc-unleashed\rtl\units\$FPCTARGET
-FuC:\works\fpc-unleashed\packages\*\units\$FPCTARGET

# 파스칼 소스는 UTF-8 로 읽는다 (LumiPascal 규약)
-FcUTF8
