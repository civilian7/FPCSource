# stage3rt 로컬 설정 - 컴파일러는 cwd 의 fpc.cfg 를 가장 먼저 찾으므로
# 여기서 빌드하면 PPC_CONFIG_PATH 없이도 이 파일이 적용된다.
#
# ⚠ 커맨드라인 `-Fp` 는 현재 동작하지 않는다(파라미터 경로 병합 결함, 미수정).
#   패키지(.pcp) 검색 경로는 설정파일 경유로만 유효 - 그래서 여기에 둔다.
#INCLUDE C:\works\fpc-unleashed\cfg\fpc.cfg
-Fp.

# 소스는 UTF-8 로 읽는다. BOM 유무에 의존하지 않게 명시한다
# (전역 인코딩 훅이 이 트리를 제외하므로 새 파일에 BOM 이 붙지 않는다).
-FcUTF8
