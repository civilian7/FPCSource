# 로컬 설정 - 컴파일러는 cwd 의 fpc.cfg 를 가장 먼저 찾으므로 여기서
# 빌드하면 PPC_CONFIG_PATH 없이도 이 파일이 적용된다. 다만 그 경우
# 기본 설정을 대체하므로 툴체인 설정을 #INCLUDE 로 끌어와야 한다.
#
# ⚠ 커맨드라인 `-Fp` 는 동작하지 않는다(파라미터 경로 병합 결함, 미수정).
#   패키지 심볼(.fcp) 검색 경로는 설정파일 경유로만 유효 - 그래서 여기에 둔다.
#INCLUDE C:\works\fpc-unleashed\cfg\fpc.cfg
-Fp.

# 소스는 UTF-8 로 읽는다. BOM 유무에 의존하지 않게 명시한다.
-FcUTF8
